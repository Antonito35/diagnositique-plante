services:
  postgres:
    image: postgres:15-alpine
    container_name: plantdiag_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: plantdiag_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: plantdiag_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plantdiag-api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/plantdiag_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
    command: python -m uvicorn app_minimal:app --host 0.0.0.0 --port 8000 --reload

  iot-simulator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plantdiag_iot
    volumes:
      - .:/app
    environment:
      API_URL: http://api:8000
      SENSOR_INTERVAL_SECONDS: 60
      SENSOR_USER_ID: 1
    depends_on:
      - api
    restart: unless-stopped
    command: python iot_simulator.py

volumes:
  postgres_data:
  redis_data:
