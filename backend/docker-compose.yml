version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plantdiag-api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      DATABASE_URL: sqlite:///./plantdiag.db
    command: python -m uvicorn app_minimal:app --host 0.0.0.0 --port 8000 --reload
