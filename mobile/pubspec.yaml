name: plantdiag_mobile
description: Plant disease diagnosis mobile application for agricultural professionals.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.13.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Navigation
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.7
  go_router: ^12.0.0

  # State Management
  riverpod: ^2.4.0
  riverpod_annotation: ^2.1.0
  flutter_riverpod: ^2.4.0

  # API & HTTP
  dio: ^5.3.1
  retrofit: ^4.1.0
  json_annotation: ^4.8.0

  # Authentication
  flutter_secure_storage: ^9.0.0

  # Camera & Image
  camera: ^0.10.5+5
  image_picker: ^1.0.4
  image: ^4.1.1

  # Storage & Database
  sqflite: ^2.3.0
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Maps - OSM
  flutter_map: ^6.0.0
  latlong2: ^0.9.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.0.0
  logger: ^2.0.1

  # Charts & Analytics
  fl_chart: ^0.65.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.7.1
  retrofit_generator: ^8.1.0
  riverpod_generator: ^2.3.5
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
