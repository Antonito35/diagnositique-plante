version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: plantdiag_postgres
    environment:
      POSTGRES_USER: plantdiag_user
      POSTGRES_PASSWORD: plantdiag_password_dev
      POSTGRES_DB: plantdiag
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "5432:5432"
    networks:
      - plantdiag_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plantdiag_user -d plantdiag"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: plantdiag_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - plantdiag_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # FastAPI Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plantdiag_api
    environment:
      DATABASE_URL: postgresql://plantdiag_user:plantdiag_password_dev@postgres:5432/plantdiag
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      PORT: 8000
      DEBUG: "True"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./models:/app/models
    networks:
      - plantdiag_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    command: >
      sh -c "python -m uvicorn app:app --host 0.0.0.0 --port 8000 --reload"

  # Nginx Reverse Proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: plantdiag_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/ssl:/etc/nginx/ssl:ro
    networks:
      - plantdiag_network
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  # pgAdmin (Database GUI - Development only)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: plantdiag_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@plantdiag.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - plantdiag_network
    depends_on:
      - postgres
    restart: unless-stopped
    profiles:
      - dev

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  plantdiag_network:
    driver: bridge
